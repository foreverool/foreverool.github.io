name: Generate AI Summaries

on:
  push:
    paths:
      - 'content/posts/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        # 阿里云百炼提供了专门的SDK，也可以直接用requests库
        run: pip install requests pyyaml

      - name: Generate summaries with Bailian
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }} # 使用新配置的密钥
        run: python scripts/generate_summaries_bailian.py # 使用新的脚本文件

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/summaries.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update AI summaries (Bailian)"
          git push