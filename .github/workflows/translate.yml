name: DeepSeek 自动翻译文档

on:
  issue_comment:
    types: [created]

jobs:
  translate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # 关键：设置环境变量覆盖 API 地址
    env:
      OPENAI_BASE_URL: "https://api.deepseek.com"
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 批量翻译 docs 目录到简体中文（DeepSeek）
        if: contains(github.event.comment.body, '/translate-docs')
        # 用原生 3ru/gpt-translate@master，无需第三方版本
        uses: 3ru/gpt-translate@master
        with:
          # 必填：DeepSeek API Key（替换为你的密钥）
          apikey: ${{ secrets.OPENAI_API_KEY }}
          # 必填：DeepSeek 支持的模型
          model: "deepseek-chat"
          # 翻译文件路径（和之前一致）
          inputFiles: "content/**/*.md"
          outputFiles: "content/en/**/*.md"
          # 目标语言
          languages: "Simplified-Chinese"
          token: ${{ github.token }}