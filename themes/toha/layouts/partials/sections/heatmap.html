<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var dataMap = {};
  {{ $postsPages := where (where site.Pages "Section" "posts") "Kind" "page" }}
  {{ $notesPages :=  where (where site.Pages "Section" "notes") "Kind" "page" }}
  {{ $allPages := $postsPages | union $notesPages}}
  {{ range $allPages }} // Works on regular content pages, i.e. not list pages, taxonomy, terms. 
    // 1. 定义当前文章的详情对象（转义特殊字符，避免破坏 JS 语法）
  var articleDetail = {
    wordCount: {{ .WordCount }}, // 文章字数（数字类型，直接嵌入）
    link: "{{ .RelPermalink | htmlEscape }}" // 文章相对链接（转义特殊字符）
  };

  // 2. 定义当前文章的映射对象（键：转义后的文章标题，值：文章详情）
  var articleMap = {};
  articleMap["{{ .Title | htmlEscape }}"] = articleDetail;

  // 3. 定义当前日期（转义，避免特殊字符，作为 dataMap 的键）
  var currentDate = "{{ .Date.Format "2006-01-02" | htmlEscape }}";

  // 4. 关键：判断当前日期对应的数组是否存在，不存在则初始化空数组（避免重置）
  if (!Array.isArray(dataMap[currentDate])) {
    dataMap[currentDate] = [];
  }

  // 5. 补全逻辑：将文章映射对象推入对应日期的数组（实现数据累加）
  dataMap[currentDate].push(articleMap);

  {{ end }}
 
  
  function filterDataByYear(year) {
    var filtered = [];
    for (const [date, value] of Object.entries(dataMap)) {
   
      if (date.startsWith(year)) {
        var count = 0
        for (let i = 0; i<value.length; i++){
          for (const [t, v] of Object.entries(value[i]))
        {
              
              count = count + v.wordCount
        }
        }
        console.log(count)
        filtered.push([date, count]);
      }
    }
 
    return filtered;
  }

  // Count the total number of posts per year
  function getDotCount(year) {
    let count = 0;
    for (const [date,value] of  Object.entries(dataMap)) {
        if (date.startsWith(year)) {
            count = count + value.length
        }
    }
    return count;
    }

  var chartDom = document.getElementById('heatmap');
 var myChart = echarts.init(chartDom, null, { renderer: 'canvas' }); // Renderer can = canvas or svg. Try both to see which works better for you

  // Resize event listener
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            myChart.resize();
        }, 100); // Wait 100ms after last resize event
    });

function createOption(year) {
    const dotCount = getDotCount(year);
    // 检测是否为暗色模式
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const textColor = isDark ? '#a0a0a0' : '#555';
    const borderColor = isDark ? '#2a3332' : '#ffffff';

    return {
      textStyle: {
        fontFamily: "'Inter', sans-serif"
      },
      title: {
        top: 0,
        left: 'left',
        text: year + ' 年贡献记录',
        subtext: '一共发布了 ' + dotCount + ' 篇文章',
        textStyle: {
          color: isDark ? '#00cfba' : '#2c3e50',
          fontSize: 16,
          fontWeight: 600
        },
        subtextStyle: {
          color: textColor,
          fontSize: 12
        }
      },
      tooltip: {
        trigger: 'item',
        backgroundColor: isDark ? '#1a1b1e' : '#ffffff',
        borderColor: '#00cfba',
        borderWidth: 1,
        padding: [10, 15],
        textStyle: {
          color: isDark ? '#d4d4d4' : '#2c3e50',
          fontSize: 12
        },
        formatter: function (p) {
          const date = p.data[0];
          const posts = dataMap[date] || [];
          const totalWords = posts.reduce((sum, art) => {
            const detail = Object.values(art)[0];
            return sum + detail.wordCount;
          }, 0);
          
          let res = `<div style="margin-bottom:5px; font-weight:600; color:#00cfba;">${date}</div>`;
          res += `共计: ${totalWords} 字 / ${posts.length} 篇文章`;
          return res;
        }
      },
      visualMap: {
        min: 0,
        max: 4000,
        type: 'piecewise',
        orient: 'horizontal',
        left: 'center',
        bottom: 0,
        showLabel: true,
        itemSymbol: 'roundRect',
        pieces: [
          { min: 0, max: 0, label: '无', color: isDark ? '#2d333b' : '#ebedf0' },
          { min: 1, max: 1000, label: '1k-', color: '#b9f2e5' },
          { min: 1000, max: 2000, label: '1k-2k', color: '#4fdcc1' },
          { min: 2000, max: 3000, label: '2k-3k', color: '#00cfba' },
          { min: 3000, max: 99999, label: '3k+', color: '#009d8d' }
        ],
        textStyle: {
          color: textColor
        }
      },
      calendar: {
        top: 80,
        left: 30,
        right: 30,
        cellSize: ['auto', 13],
        range: year,
        itemStyle: {
          color: isDark ? '#2d333b' : '#ebedf0',
          borderWidth: 2,
          borderColor: borderColor
        },
        splitLine: { show: false },
        yearLabel: { show: false },
        dayLabel: {
          firstDay: 1,
          nameMap: ['日', '一', '二', '三', '四', '五', '六'],
          color: textColor,
          fontSize: 10
        },
        monthLabel: {
          nameMap: 'cn',
          color: textColor,
          fontSize: 11
        }
      },
      series: [{
        type: 'heatmap',
        coordinateSystem: 'calendar',
        data: filterDataByYear(year),
        emphasis: {
          itemStyle: {
            shadowBlur: 10,
            shadowColor: 'rgba(0, 207, 186, 0.5)'
          }
        }
      }]
    };
  }
    window.changeYear = function(year) {
        let option = createOption(year);
        myChart.setOption(option, true);
    }

    window.addEventListener('resize', () => myChart.resize()); // Resize listener
    myChart.on('click', function(params) {
      if (params.componentType === 'series') {
        const post = dataMap[params.data[0]][0];
        if (post) {
          for (const [t,v] of Object.entries(post)){
             const link = window.location.origin +v.link;
              window.open(link, '_blank').focus();
          }
         
        }
      }
    });

  // Initialize with the current year with Hugo's now.Format or manually `changeYear('2020')`
  changeYear('{{ now.Format "2006" }}');
  });

// // Uncomment line below to access the JSON dataMap in browser console with`JSON.stringify([window.__dataMapSnapshot])`. Only works when in localhost mode or when the word debug is in the URL like `?debug`
//   if (location.search.includes('debug') || location.hostname === 'localhost') {
//   window.__dataMapSnapshot = Object.freeze(Object.fromEntries(dataMap));
// }
</script>

<br/>
<div class="heatmap-wrapper">
    <div class="heatmap-year-buttons"> <!-- The year-buttons can be removed if you only wish to show a single year -->
        <button onclick="changeYear('2026')">2026</button>
    </div>
    <div id="heatmap" class="heatmap"></div>
</div>
